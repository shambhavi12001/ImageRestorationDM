    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40S
      containers:
      - args:
        - |
          pip install -q numpy scikit-image pillow pyyaml tqdm pandas scipy matplotlib lpips
          cd /work/faithful-sr
          ln -sfn /work/data /work/faithful-sr/data
          mkdir -p /work/logs /work/timing_test
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv > /work/logs/gpu_timing.log 2>&1
          python scripts/train.py --steps 400 --log-every 50 --ckpt-every 100000 \
            --batch-size 16 --patch 128 --amp bf16 --out /work/timing_test \
            >> /work/logs/gpu_timing.log 2>&1
          echo finished > /work/logs/DONE_gpu_timing
        command:
        - /bin/bash
        - -c
